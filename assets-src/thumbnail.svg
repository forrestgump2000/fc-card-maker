    <rect x="788" y="128" width="234" height="364" rx="24" fill="none" stroke="#fff6d6" stroke-width="4" opacity="0.8"/>
    <text x="905" y="270" text-anchor="middle" font-family="Avenir Next Condensed" font-weight="800" font-size="130" fill="#2a1d02">99</text>
    <text x="905" y="420" text-anchor="middle" font-family="Avenir Next Condensed" font-weight="800" font-size="90" fill="#2a1d02">FC</text>
